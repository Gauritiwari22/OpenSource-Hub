<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSource Hub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="container">
        <div class="card form-card" style="margin-top: 2rem;">
            <h2>Welcome Back</h2>
            <p class="text-muted">Log in to manage your bookmarks and contributions.</p>
            
            <div id="errorMsg" class="error-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </main>

    <div id="footer"></div>
    <script src="js/navbar.js"></script>
        <script src="js/navbar.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</body>
</html>

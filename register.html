<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSource Hub - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="container" style="padding: 3rem 0; max-width: 400px;">
        <h2>Create an Account</h2>
        <div id="errorMsg" style="color: red; margin-bottom: 1rem;"></div>
        <form>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Full Name</label><br>
                <input type="text" id="name" style="width: 100%; padding: 0.5rem;" required>
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Email</label><br>
                <input type="email" id="email" style="width: 100%; padding: 0.5rem;" required>
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>Password</label><br>
                <input type="password" id="password" style="width: 100%; padding: 0.5rem;" required>
            </div>
            <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Register</button>
        </form>
    </main>

    <div id="footer"></div>
    <script src="js/navbar.js"></script>
</body>
</html>

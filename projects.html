<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSource Hub - Explore Projects</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="container" style="padding: 3rem 0;">
        <h1 style="margin-bottom: 0.5rem;">Explore Open Source Projects</h1>
        <p class="text-muted" style="margin-bottom: 2rem;">Find repositories matching your interests, programming language, and skill level.</p>

        <!-- Filter Bar -->
        <div class="card" style="margin-bottom: 2.5rem; background: #ffffff;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="searchQuery">Search</label>
                    <input type="text" id="searchQuery" placeholder="Search by title or description...">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="categoryFilter">Category</label>
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="languageFilter">Language</label>
                    <select id="languageFilter">
                        <option value="">All Languages</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="difficultyFilter">Difficulty</label>
                    <select id="difficultyFilter">
                        <option value="">All Difficulties</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 1.25rem; display: flex; gap: 1rem;">
                <button id="resetFilters" class="btn" style="padding: 0.5rem 1rem; background: #f1f5f9; border-color: var(--border);">Reset Filters</button>
            </div>
        </div>

        <!-- Loading, error and empty states -->
        <div id="loadingState" class="text-center hidden" style="padding: 3rem;">
            <p class="text-muted">Loading projects...</p>
        </div>

        <div id="errorState" class="error-msg hidden"></div>

        <div id="emptyState" class="card text-center hidden" style="padding: 3rem;">
            <h3>No matching projects found</h3>
            <p class="text-muted" style="margin-top: 0.5rem;">Try adjusting your search terms or filter selections.</p>
        </div>

        <div id="projectsGrid" class="grid"></div>
    </main>

    <div id="footer"></div>

    <script type="module">
        import { getProjects, getFilterOptions } from './js/projects.js';
        import { getCurrentUser, onAuthChange } from './js/auth.js';

        const grid = document.getElementById("projectsGrid");
        const searchQuery = document.getElementById("searchQuery");
        const categoryFilter = document.getElementById("categoryFilter");
        const languageFilter = document.getElementById("languageFilter");
        const difficultyFilter = document.getElementById("difficultyFilter");
        const resetBtn = document.getElementById("resetFilters");
        const emptyState = document.getElementById("emptyState");
        const loadingState = document.getElementById("loadingState");
        const errorState = document.getElementById("errorState");

        let currentUser = null;
        let requestId = 0;

        function esc(text) {
            const d = document.createElement("div");
            d.textContent = text ?? "";
            return d.innerHTML;
        }

        function safeUrl(url) {
            return /^https?:\/\//i.test(url || "") ? url : "#";
        }

        function badgeClass(difficulty) {
            if (difficulty === "Beginner") return "badge-beginner";
            if (difficulty === "Intermediate") return "badge-intermediate";
            if (difficulty === "Advanced") return "badge-advanced";
            return "tag";
        }

        function showLoading(on) { 
            if (on) {
                loadingState.classList.remove("hidden");
            } else {
                loadingState.classList.add("hidden");
            }
        }

        function showError(msg) {
            if (msg) {
                errorState.textContent = msg;
                errorState.classList.remove("hidden");
            } else {
                errorState.classList.add("hidden");
            }
        }

        function renderProjects(data) {
            grid.innerHTML = "";
            if (!data || data.length === 0) {
                emptyState.classList.remove("hidden");
                return;
            }
            emptyState.classList.add("hidden");

            data.forEach(p => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <div>
                            <span class="tag">${esc(p.language)}</span>
                            <span class="badge ${badgeClass(p.difficulty)}">${esc(p.difficulty)}</span>
                        </div>
                        <button id="bookmark-${p.id}" class="bookmark-btn" data-id="${p.id}" aria-label="Bookmark" style="background:none;border:none;font-size:1.3rem;cursor:pointer;">☆</button>
                    </div>
                    <h3 class="card-title" style="font-size: 1.15rem; margin-bottom: 8px;">${esc(p.title)}</h3>
                    <p class="text-muted" style="font-size: 0.95rem; margin-bottom: 1.5rem;">${esc(p.description)}</p>
                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem;">
                        <span style="font-size: 0.85rem; color: var(--text-muted);">${esc(p.category)}</span>
                        <a href="${esc(safeUrl(p.github_url))}" target="_blank" rel="noopener noreferrer" class="btn btn-primary github-link" style="padding: 6px 14px; font-size: 0.85rem;">View on GitHub</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        grid.addEventListener("click", (e) => {
            const link = e.target.closest(".github-link");
            if (link && !currentUser) {
                e.preventDefault();
                alert("Please log in or register to access project links!");
                window.location.href = "register.html";
            }
        });

        async function loadProjects() {
            const myId = ++requestId;
            showError("");
            emptyState.classList.add("hidden");
            grid.innerHTML = "";
            showLoading(true);

            try {
                const list = await getProjects({
                    category: categoryFilter.value,
                    language: languageFilter.value,
                    difficulty: difficultyFilter.value,
                    search: searchQuery.value
                });
                if (myId !== requestId) return;
                showLoading(false);
                renderProjects(list);
            } catch (err) {
                if (myId !== requestId) return;
                showLoading(false);
                showError(err.message);
            }
        }

        async function fillDropdowns() {
            try {
                const { categories, languages } = await getFilterOptions();
                categories.forEach(c => categoryFilter.add(new Option(c, c)));
                languages.forEach(l => languageFilter.add(new Option(l, l)));
            } catch (err) {
                console.error(err);
            }
        }

        let timer;
        searchQuery.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(loadProjects, 300);
        });
        categoryFilter.addEventListener("change", loadProjects);
        languageFilter.addEventListener("change", loadProjects);
        difficultyFilter.addEventListener("change", loadProjects);

        resetBtn.addEventListener("click", () => {
            searchQuery.value = "";
            categoryFilter.value = "";
            languageFilter.value = "";
            difficultyFilter.value = "";
            loadProjects();
        });

        // Start
        currentUser = await getCurrentUser();
        onAuthChange(user => { currentUser = user; });
        await fillDropdowns();
        loadProjects();
    </script>
    <script src="js/navbar.js"></script>
</body>
</html>
